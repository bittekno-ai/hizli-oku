# app/ klasörünü GitHub Pages'te yayınlar. Repo ayarlarında Pages kaynağı "GitHub Actions" seçilmelidir.
name: Web sürümü

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: dagit
        uses: actions/deploy-pages@v5

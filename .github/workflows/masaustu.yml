# Mac (.dmg) ve Windows (.exe) paketlerini derler.
# Elle çalıştırma: GitHub > Actions > "Masaüstü paketleri" > Run workflow. Paketler "Artifacts" altında çıkar.
# v ile başlayan bir etiket (ör. v0.1.0) gönderilirse taslak bir sürüm (Release) da hazırlanır.
name: Masaüstü paketleri

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  derle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            ad: mac
          - platform: windows-latest
            args: ''
            ad: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'Hızlı Oku ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: hizli-oku-${{ matrix.ad }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error
